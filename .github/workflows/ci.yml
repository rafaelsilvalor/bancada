name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Validate marketplace manifest
        run: claude plugin validate . --strict

      # Per plugin as well as for the catalog, because the two see different
      # things. A malformed hooks/hooks.json fails here and passes the
      # marketplace check above; neither of them opens the file to ask whether
      # the script a hook names exists. That last gap is covered by the wiring
      # tests in the `test` job, which read the command out of hooks.json and
      # spawn it.
      - name: Validate plugin manifests
        run: |
          for p in plugins/*/; do
            echo "--- $p"
            claude plugin validate "$p" --strict
          done

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # bancada has zero npm dependencies on purpose: a harness that runs in
      # everyone's PreToolUse should not carry a dependency tree. There is
      # nothing to install, so there is no install step.
      #
      # The glob is `plugins/*/**` rather than `plugins/*/lib/**`. Under the
      # narrower one a test file anywhere but `lib/` was collected by nothing and
      # reported by nothing — an always-failing test dropped in `hooks/` was
      # measured passing CI. The wiring tests live next to the entry points they
      # spawn, which is where a reader looks for them.
      - name: Run unit and wiring tests
        run: node --test "plugins/*/**/*.test.mjs"

  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # The layering sweep, run on this repository by its own gate. The
      # PreToolUse hook already refuses a violation in the turn that writes one,
      # which is the whole argument for gating at the hook rather than in CI —
      # but only for a turn that went through the hook. A violation arriving by
      # merge, from an editor without the plugin, or from a session with the
      # plugin switched off met nothing at all: an offending import in a file
      # nothing else imports passed all nine checks of the previous CI and was
      # caught by this command in one line.
      - name: No layering violation in this repository
        run: node plugins/bancada/bin/bancada.mjs check

      # No rule-identifier scheme, one of the design commitments in README.md:
      # bancada must not introduce one that a consumer would inherit, because a
      # citation like "R14" means nothing outside the repo that defined it. The
      # product cites concepts by name instead.
      - name: No inherited rule identifiers in prose
        run: node scripts/check-no-rule-ids.mjs

      # Cost is compared against a committed baseline, not against an invented
      # ceiling. Growth inside the tolerance is silent; growth past it fails
      # until someone records a new baseline, which makes every increase a
      # decision in the history rather than a drift nobody noticed.
      - name: Cost against the recorded baseline
        run: node scripts/check-cost.mjs

      # The JSON Schema an editor autocompletes against, the settings table
      # people read in docs/configuration.md, and the SPEC the gates enforce
      # must be the same thing. Hand-written copies drift, and the drift is
      # invisible until an editor says a setting is fine and the validator says
      # it is not, or until a documented default is not the default.
      - name: Config schema and settings table match the SPEC
        run: node scripts/gen-schema.mjs --check

      # An example config is documentation people copy without reading. A knob
      # renamed in the SPEC turns every example that sets it into an unknown
      # key, silently ignored, and the gate the reader thinks they switched on
      # is not running.
      - name: Example configs validate against the SPEC
        run: node scripts/check-docs.mjs
